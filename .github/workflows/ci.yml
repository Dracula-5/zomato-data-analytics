name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the full history

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies (exact versions from uv.lock)
        run: uv sync --locked --all-groups

      - name: Generic hooks + gitleaks secret scan
        run: SKIP=ruff,ruff-format,mypy uv run pre-commit run --all-files --show-diff-on-failure

      - name: Lint, type check, tests with 80% coverage gate
        run: make check

      - name: Whole pipeline + dbt build on the SYNTHETIC fixture
        run: make demo

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: artifacts/

  airflow-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the Airflow image (Airflow 3.3.2 + project venv from uv.lock)
        run: docker build -f airflow/Dockerfile -t zap-airflow:ci .

      - name: Every DAG parses with no import errors
        run: |
          docker run --rm -v "$PWD:/opt/project:ro" -v "$PWD/airflow/dags:/opt/airflow/dags:ro" \
            -e PYTHONPATH=/opt/project/src zap-airflow:ci bash /opt/project/airflow/check_dags.sh
