name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the full history

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies (exact versions from uv.lock)
        run: uv sync --locked --all-groups

      - name: Generic hooks + gitleaks secret scan
        run: SKIP=ruff,ruff-format,mypy uv run pre-commit run --all-files --show-diff-on-failure

      - name: Lint, type check, tests with 80% coverage gate
        run: make check

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: artifacts/
