# Header matches the real file. Profiling (2026-10-30) showed menu_id is NOT unique on its
# own: 1,179,936 rows but 1,048,575 distinct menu_ids, so the key is (menu_id, f_id).
table: menu
file: menu.csv
kind: dimension
description: Which restaurant sells which food item, and at what price (restaurant x food bridge).
has_index_column: true
primary_key: [menu_id, f_id]
columns:
  - name: menu_id
    description: Menu identifier; repeats across lines, unique together with f_id.
  - name: r_id
    description: Restaurant identifier (references restaurant.id).
  - name: f_id
    description: Food item identifier (references food.f_id).
  - name: cuisine
    description: Cuisine the item is listed under at this restaurant.
    classification: public
  - name: price
    description: Listed price in INR as text; a few rows hold cost-for-two text such as "₹200 FOR TWO".
    classification: public
