# The first draft of this contract used the reference repo's snake_case DDL names. The
# drift check flagged the real file as BREAKING (2026-10-30): its headers are "Age",
# "Marital Status", ... This contract now matches the real file; staging renames to snake_case.
table: users
file: users.csv
kind: dimension
description: >-
  Registered customers with demographic attributes. Contains personal data, so the
  personal columns are classified and masked or dropped downstream.
has_index_column: true
primary_key: [user_id]
columns:
  - name: user_id
    description: Customer identifier (pseudonymous key used by orders).
  - name: name
    description: Customer full name.
    classification: pii
  - name: email
    description: Customer email address.
    classification: pii
  - name: password
    description: >-
      Account password as stored in the source (plain text). Dropped at ingestion: it is
      never written to the lake, S3 or any warehouse.
    classification: secret
  - name: "Age"
    description: Customer age in years.
  - name: "Gender"
    description: Self-reported gender.
    classification: pii
  - name: "Marital Status"
    description: Self-reported marital status.
    classification: pii
  - name: "Occupation"
    description: Occupation category, e.g. "Student" or "Employee".
  - name: "Monthly Income"
    description: Monthly income bracket as text.
    classification: pii
  - name: "Educational Qualifications"
    description: Highest educational qualification.
  - name: "Family size"
    description: Number of people in the household.
