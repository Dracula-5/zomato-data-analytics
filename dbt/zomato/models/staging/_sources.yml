    - name: cuisine
      description: Cuisine the item is listed under at this restaurant.
      data_type: VARCHAR
      meta:
        classification: public
    - name: price
      description: Listed price in INR as text; a few rows hold cost-for-two text such as "₹200 FOR TWO".
      data_type: VARCHAR
      meta:
        classification: public
    - name: _batch_id
      description: Ingestion run that wrote the row.
    - name: _source_file
      description: Source CSV file name.
    - name: _loaded_at
