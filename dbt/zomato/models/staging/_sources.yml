      data_type: TIMESTAMP
      meta:
        classification: internal
    - name: order_date
      description: Calendar date of order_timestamp; the lake partition key.
      data_type: DATE
      meta:
        classification: internal
    - name: user_id
      description: Customer who placed the order (references users.user_id).
      data_type: BIGINT
      meta:
        classification: internal
    - name: r_id
      description: Restaurant that received the order (references restaurant.id).
      data_type: BIGINT
      meta:
        classification: internal
    - name: restaurant_city
      description: Restaurant location at order time, "Area,City" or "City".
      data_type: VARCHAR
      meta:
        classification: internal
    - name: cuisine
      description: Restaurant cuisines at order time, comma-separated.
      data_type: VARCHAR
      meta:
        classification: internal
    - name: items_count
      description: Number of distinct menu lines in the order.
      data_type: BIGINT
      meta:
        classification: internal
    - name: sales_qty
      description: Total units across all lines.
      data_type: BIGINT
      meta:
        classification: internal
    - name: subtotal
      description: Sum of line amounts before discount, fees and tax (INR).
      data_type: BIGINT
      meta:
        classification: internal
    - name: discount
      description: Discount applied (INR).
      data_type: BIGINT
      meta:
        classification: internal
    - name: delivery_fee
      description: Delivery fee charged (INR).
      data_type: BIGINT
      meta:
        classification: internal
    - name: gst
      description: Goods and Services Tax (INR), 5% of subtotal.
      data_type: BIGINT
      meta:
        classification: internal
    - name: sales_amount
      description: Amount paid = subtotal - discount + delivery_fee + gst (INR).
      data_type: BIGINT
      meta:
        classification: internal
    - name: currency
      description: ISO currency code; always "INR".
      data_type: VARCHAR
      meta:
        classification: internal
    - name: payment_method
      description: One of UPI, Card, Wallet, COD, NetBanking.
      data_type: VARCHAR
      meta:
        classification: internal
    - name: order_status
      description: One of Delivered, Cancelled, Refunded.
      data_type: VARCHAR
      meta:
        classification: internal
    - name: customer_rating
      description: Customer rating 1-5 for delivered orders; empty otherwise.
      data_type: DOUBLE
      meta:
        classification: internal
    - name: delivery_time_min
      description: Minutes from order to delivery for delivered orders; empty otherwise.
      data_type: DOUBLE
      meta:
        classification: internal
    - name: _batch_id
      description: Ingestion run that wrote the row.
