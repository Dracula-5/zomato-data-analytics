    meta:
      file: restaurant.csv
      kind: dimension
      primary_key:
      - id
    columns:
    - name: id
      description: Restaurant identifier from the source platform.
      data_type: VARCHAR
      meta:
        classification: internal
    - name: name
      description: Restaurant display name.
      data_type: VARCHAR
      meta:
        classification: public
    - name: city
      description: Location as "Area,City" (e.g. "Koramangala,Bangalore") or just "City".
      data_type: VARCHAR
      meta:
        classification: public
    - name: rating
      description: Average customer rating 0-5 as text; "--" when there are too few ratings.
      data_type: VARCHAR
      meta:
        classification: public
    - name: rating_count
      description: Bucketed number of ratings as text, e.g. "50+ ratings" or "Too Few Ratings".
      data_type: VARCHAR
      meta:
        classification: public
    - name: cost
      description: Approximate cost for two as display text, e.g. "₹ 200".
      data_type: VARCHAR
      meta:
        classification: public
    - name: cuisine
      description: Comma-separated list of cuisines served.
      data_type: VARCHAR
      meta:
        classification: public
    - name: lic_no
      description: Food-safety (FSSAI) licence number of the business.
      data_type: VARCHAR
      meta:
        classification: internal
    - name: link
      description: URL of the restaurant page on the source site.
      data_type: VARCHAR
      meta:
        classification: public
    - name: address
      description: Street address of the restaurant (a business address; may contain newlines).
      data_type: VARCHAR
      meta:
        classification: public
    - name: menu
      description: Path of the source menu JSON file. The JSON files are not part of the dataset.
      data_type: VARCHAR
      meta:
        classification: internal
    - name: _batch_id
      description: Ingestion run that wrote the row.
    - name: _source_file
