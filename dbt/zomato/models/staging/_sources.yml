      meta:
        classification: pii
    - name: Marital Status
      description: Self-reported marital status.
      data_type: VARCHAR
      meta:
        classification: pii
    - name: Occupation
      description: Occupation category, e.g. "Student" or "Employee".
      data_type: VARCHAR
      meta:
        classification: internal
    - name: Monthly Income
      description: Monthly income bracket as text.
      data_type: VARCHAR
      meta:
        classification: pii
    - name: Educational Qualifications
      description: Highest educational qualification.
      data_type: VARCHAR
      meta:
        classification: internal
    - name: Family size
      description: Number of people in the household.
      data_type: VARCHAR
      meta:
        classification: internal
    - name: _batch_id
      description: Ingestion run that wrote the row.
    - name: _source_file
      description: Source CSV file name.
    - name: _loaded_at
      description: UTC time the row was ingested.
