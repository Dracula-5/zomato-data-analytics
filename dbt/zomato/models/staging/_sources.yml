    columns:
    - name: menu_id
      description: Menu identifier; repeats across lines, unique together with f_id.
      data_type: VARCHAR
      meta:
        classification: internal
    - name: r_id
      description: Restaurant identifier (references restaurant.id).
      data_type: VARCHAR
      meta:
        classification: internal
