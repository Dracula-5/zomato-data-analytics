# Credentials never live here: every value comes from an environment variable.
# `zap dbt ...` sets DUCKDB_PATH for the selected dataset; `zap cloud dbt ...` selects Snowflake.
zomato:
  target: "{{ env_var('DBT_TARGET', 'duckdb') }}"
  outputs:
    duckdb:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', 'zomato.duckdb') }}"
      schema: main
      threads: 4
      # Bounded memory: past the limit DuckDB spills to <db file>.tmp instead of failing.
      settings:
        memory_limit: "{{ env_var('DUCKDB_MEMORY_LIMIT', '6GB') }}"
        preserve_insertion_order: false
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'not-set') }}"
      user: "{{ env_var('SNOWFLAKE_USER', 'ZAP_SVC') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'ZAP_DEPLOYER') }}"
      # Key-pair sign-in: the private key file lives outside the repo.
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', 'not-set') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'ZAP_XS') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'ZOMATO') }}"
      schema: STAGING
      threads: 4
      query_tag: zomato-ai-data-platform
