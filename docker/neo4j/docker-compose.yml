# Neo4j 5 LTS with the Graph Data Science plugin, for `make up-neo4j`. Both ports listen on
# 127.0.0.1 only. Don't run this next to Airflow: together they need more RAM than Docker has.
# The password comes from the repo's .env. GDS 2.13.13 is the release published for 5.26.31,
# and the image downloads it on first start, into the plugins volume.
name: zap-neo4j

services:
  neo4j:
    image: neo4j:5.26.31-community
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      # Not NEO4J_*: the image turns those into settings, and it rejects unknown ones.
      HEALTHCHECK_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: gds.*
      NEO4J_dbms_security_procedures_allowlist: gds.*
      NEO4J_server_memory_heap_initial__size: 2g
      NEO4J_server_memory_heap_max__size: 2g
      NEO4J_server_memory_pagecache_size: 1g
      # The graph is rebuilt from the warehouse, so old transaction logs have no value.
      NEO4J_db_tx__log_rotation_retention__policy: "256M size"
    volumes:
      - neo4j-data:/data
      - neo4j-plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", 'cypher-shell -u neo4j -p "$$HEALTHCHECK_PASSWORD" "RETURN 1" || exit 1']
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

volumes:
  neo4j-data:
  neo4j-plugins:
