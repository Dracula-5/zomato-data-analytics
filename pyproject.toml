[project]
name = "zomato-ai-data-platform"
version = "0.1.0"
description = "Food-delivery data platform: lake, warehouse, dbt, governance, graph, forecasting and evaluated GenAI."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6",
    "typer>=0.12",
]

[project.scripts]
zap = "zap.cli:app"

[dependency-groups]
app = [
    "plotly>=5.24",
    "streamlit>=1.40",
]
dbt = [
    "dbt-core>=1.12.6",
    "dbt-duckdb>=1.11.1",
]
dev = [
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5",
    "ruff>=0.6",
    "types-pyyaml>=6",
]
quality = [
    "great-expectations>=1.3",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv]
# Every group is installed by default, so `uv run` never silently drops dbt or GX.
default-groups = ["dev", "dbt", "quality", "app"]

[tool.uv.build-backend]
module-name = "zap"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S608"]         # pytest asserts; SQL built from test-owned temp paths
"src/zap/fixtures.py" = ["S311"]      # non-crypto RNG is intended for fake data

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pyarrow.*", "duckdb.*", "plotly.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["zap"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
