[project]
name = "zomato-ai-data-platform"
version = "0.1.0"
description = "Food-delivery data platform: lake, warehouse, dbt, governance, graph, forecasting and evaluated GenAI."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6",
    "typer>=0.12",
]

[project.scripts]
zap = "zap.cli:app"

[dependency-groups]
app = [
    "plotly>=5.24",
    "streamlit>=1.40",
]
cloud = [
    "boto3>=1.43.122",
    "snowflake-connector-python>=4.2,<5",
]
dbt = [
    "dbt-core>=1.12.6",
    "dbt-duckdb>=1.11.1",
    "dbt-snowflake>=1.12.4",
]
dev = [
    "moto[iam,s3,sts]>=5.2.5",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5",
    "ruff>=0.6",
    "types-pyyaml>=6",
]
forecast = [
    "lightgbm>=4.7.0",
    "statsmodels>=0.15.0",
]
graph = [
    "neo4j>=6.4.1",
    "scipy>=1.14",
]
quality = [
    "great-expectations>=1.3",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv]
# Every group is installed by default, so `uv run` never silently drops dbt or GX.
default-groups = ["dev", "dbt", "quality", "app", "cloud", "forecast", "graph"]

[tool.uv.build-backend]
module-name = "zap"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S608"]         # pytest asserts; SQL built from test-owned temp paths
"src/zap/fixtures.py" = ["S311"]      # non-crypto RNG is intended for fake data

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "pyarrow.*",
    "duckdb.*",
    "plotly.*",
    "boto3.*",
    "botocore.*",
    "moto.*",
    "lightgbm.*",
    "statsmodels.*",
    "scipy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["zap"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
